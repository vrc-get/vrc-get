name: Publish (Online Installer)

on:
  workflow_dispatch:
    inputs:
      release_kind:
        type: choice
        description: The type of release.
        default: prerelease
        required: true
        options:
          - prerelease
          - start-rc
          - stable
      dry-run:
        type: boolean
        description: Dry Run, If true, do not publish release to GitHub.
        default: true
        required: false

concurrency:
  group: releasing

jobs:
  pre-build:
    name: Update version name
    runs-on: ubuntu-latest
    outputs:
      installer-version: ${{ env.INSTALLER_VERSION }}
      prerelease: ${{ steps.update-version.outputs.prerelease }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: anatawa12/something-releaser@v3
      - uses: snow-actions/git-config-user@v1.0.0
      - run: rustup update stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update Version Name
        id: update-version
        run: |
          # set version name in properties file
          case "$RELEASE_KIND_IN" in
            "prerelease" )
              get-version -t online-installer | version-next | set-version -t online-installer
              gh-export-variable PRERELEASE true
              gh-set-output prerelease true
              ;;
            "start-rc" )
              get-version -t online-installer | version-set-channel - rc 0 | set-version -t online-installer
              gh-export-variable PRERELEASE true
              gh-set-output prerelease true
              ;;
            "stable" )
              get-version -t online-installer | version-set-channel - stable | set-version -t online-installer
              gh-export-variable PRERELEASE false
              gh-set-output prerelease '' # empty string for false
              ;;
            * )
              echo "invalid release kind: $RELEASE_KIND_IN"
              exit 255
              ;;
          esac

          INSTALLER_VERSION="$(get-version -t online-installer)"

          case "$GITHUB_REF_NAME" in
            master | master-* )
              echo "head is master or master-*"
              ;;
            * )
              if [ "$DRY_RUN" = "true" ]; then
                echo "head is not master, but DRY_RUN is true"
              else
                echo "head is not master, but DRY_RUN is false"
                exit 255
              fi
              ;;
          esac

          gh-export-variable INSTALLER_VERSION "${INSTALLER_VERSION}"
        env:
          RELEASE_KIND_IN: ${{ inputs.release_kind }}
          DRY_RUN: ${{ inputs.dry-run }}

      - name: Commit
        id: update
        run: |-
          # commit & tag
          git commit -am "online-installer v$INSTALLER_VERSION"
          git branch releasing
          git push -f -u origin releasing

  build-online-installer:
    name: Build Online Installer
    needs: [ pre-build ]
    environment:
      name: actions-code-signing
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-Ctarget-feature=+crt-static'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'releasing'
          submodules: recursive
      - run: rustup update stable

      - name: Build online installer binary
        run:
          cargo build -p online-installer --target x86_64-pc-windows-msvc --profile online-installer

      - name: Sign ALCOM exe (Windows)
        uses: ./.github/actions/sign-windows
        with:
          artifact-name: alcom-exe-unsigned
          path: target/x86_64-pc-windows-msvc/online-installer/online-installer.exe

          signpath-api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signing-policy-slug: ${{ case(inputs.dry-run, 'test-signing', 'release-signing') }}
          version: ${{ needs.pre-build.outputs.gui-version }}

      - name: Upload built binary
        uses: actions/upload-artifact@v7
        with:
          name: online-installer
          path: target/x86_64-pc-windows-msvc/online-installer/online-installer.exe

  publish-to-github:
    name: Publish to GitHub
    environment:
      name: actions-github-app
      url: https://github.com/anatawa12/vrc-get/releases/online-installer-v${{ needs.pre-build.outputs.installer-version }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ pre-build, build-online-installer ]
    env:
      INSTALLER_VERSION: ${{ needs.pre-build.outputs.installer-version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: 'releasing'
          fetch-depth: 2
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      # tools
      - uses: anatawa12/something-releaser@v3
      - uses: snow-actions/git-config-user@v1.0.0
      - uses: dtolnay/rust-toolchain@stable

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          path: assets
          name: online-installer

      - name: Push tag
        if: ${{ !inputs.dry-run }}
        run: |-
          # set tag and publish current version
          git tag "online-installer-v$INSTALLER_VERSION"
          git push --tags
          # create master and push
          git switch -c master
          git fetch origin master --depth=1
          git log --all --graph
          git push -u origin master
          sleep 1

      - name: create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          # latest = false because we need to have vrc-get cli in the latest release
          gh release create \
            ${{ needs.pre-build.outputs.prerelease && '--prerelease' || '' }} \
            --latest=false \
            --notes "ALCOM Online Installer v$INSTALLER_VERSION. Check for commit log of [online-installer](https://github.com/vrc-get/vrc-get/commits/online-installer-v$INSTALLER_VERSION/vrc-get-gui/online-installer) and [updater](https://github.com/vrc-get/vrc-get/commits/online-installer-v$INSTALLER_VERSION/vrc-get-gui/src/updater) for more details." \
            ${{ case(inputs.dry-run, '--draft', '--verify-tag') }} \
            "online-installer-v$INSTALLER_VERSION" \
            assets/online-installer.exe

          rm -rf outputs assets

      - name: prepare next release & push
        if: ${{ !needs.pre-build.outputs.prerelease && !inputs.dry-run }}
        run: |
          get-version -t online-installer | version-next | version-set-channel - beta 0 | set-version -t online-installer
          INSTALLER_NEXT="$(get-version -t online-installer | version-stable)"
          git commit -am "chore: prepare for next version: online-installer $INSTALLER_NEXT"
          git push

  cleanup:
    name: Cleanup
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - pre-build
      - build-online-installer
      - publish-to-github
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'releasing'
          fetch-depth: 2
      - name: remove releasing branch
        run: git push --delete origin releasing
